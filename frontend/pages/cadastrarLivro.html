<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Entrelinhas - Cadastrar Livros</title>

        <link rel="preconnect" href="https://fonts.googleapis.com" />
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
        <link
            href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Nunito:wght@400;500;600;700;800&family=Poppins:wght@400;500;600;700&display=swap"
            rel="stylesheet"
        />

        <link
            href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css"
            rel="stylesheet"
        />

        <link rel="stylesheet" href="../css/styleGeral.css" />
    <link rel="stylesheet" href="../css/styleCadastrarLivro.css">
</head>
<body>

    <header class="topo">
        <div class="container flex-topo">
            <a href="../index.html" class="logo">
                <img src="../img/logo/logo.svg" alt="Entrelinhas" class="logo-img">
            </a>

            <nav class="menu">
                <a href="../index.html">Início</a>
                <a href="explorarlivros.html">Explorar Livros</a>
                <a href="minhaEstante.html">Minha Estante</a>
                <a href="cadastrarLivro.html" class="ativo">Cadastrar Livro</a>
                <a href="#">Perfil</a>
                    <a href="login.html" class="btn-entrar">Entrar</a>
            </nav>
        </div>
    </header>

    <main class="container cadastro-main">
        <div class="cabecalho-cadastro">
            <h1>Compartilhe uma leitura</h1>
            <p>Adicione um livro ao catálogo da comunidade Entrelinhas.</p>
        </div>

        <form class="form-cadastro">
            <h2>Informações do livro</h2>

            <div class="linha">
                <div class="campo">
                    <label for="titulo">Título do livro</label>
                    <input type="text" id="titulo" placeholder="Digite o título" required>
                </div>
                <div class="campo">
                    <label for="autor">Autor(a)</label>
                    <input type="text" id="autor" placeholder="Nome do autor" required>
                </div>
            </div>

            <div class="linha">
                <div class="campo">
                    <label for="genero">Gênero</label>
                    <select id="genero" required>
                        <option value="">Selecione um gênero</option>
                        <option value="romance">Romance</option>
                        <option value="fantasia">Fantasia</option>
                        <option value="suspense">Suspense</option>
                        <option value="terror">Terror</option>
                        <option value="poesia">Poesia</option>
                        <option value="outro">Outro</option>
                    </select>
                </div>
                <div class="campo">
                    <label for="ano">Ano de publicação</label>
                    <input type="date" id="ano" placeholder="Ex: 2024">
                </div>
            </div>

            <div class="campo">
                <label for="sinopse">Sinopse</label>
                <textarea id="sinopse" placeholder="Escreva uma breve descrição..."></textarea>
            </div>

            <!-- LIGAR: ao cadastrar, levar para a página Explorar livros -->
            <button type="submit" class="btn-salvar-livro">Cadastrar livro</button>
        </form>
    </main>

    <footer class="footer">
        <div class="footer-container">
            <div>
                <img src="../img/logo/icone.png" alt="Mascote" class="footer-logo">
                <span>&copy; Entrelinhas 2026</span>
            </div>
            <nav class="footer-nav">
                <ul>
                    <li><a href="../index.html">Início</a></li>
                    <li><a href="explorarlivros.html">Explorar livros</a></li>
                    <li><a href="minhaEstante.html">Minha estante</a></li>
                    <li><a href="cadastrarLivro.html">Cadastro de Livros</a></li>
                    <li><a href="#">Contato</a></li>
                    <li class="footer-social">
                        <a href="#" aria-label="Instagram"><i class="bx bxl-instagram"></i></a>
                        <a href="#" aria-label="Facebook"><i class="bx bxl-facebook-circle"></i></a>
                        <a href="#" aria-label="TikTok"><i class="bx bxl-tiktok"></i></a>
                        <span>@entrelinhas</span>
                    </li>
                </ul>
            </nav>
        </div>
    </footer>

</body>
</html>
